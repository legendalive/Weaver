<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weaver Admin — AI Keys</title>
<style>
:root{--bg:#0b0b0c;--surface:#141416;--surface-2:#1c1c20;--border:#2b2b30;--strong:#3a3a40;--text:#e8e5dd;--muted:#94918a;--faint:#6b6862;--accent:#e0a83c;--soft:rgba(224,168,60,.14);--danger:#d4604f;--ok:#7fb069}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);padding:24px}
a{color:var(--accent);text-decoration:none}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
h1{font-size:1.35rem}
.sub{color:var(--faint);font-size:.78rem;margin-bottom:20px}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:9px;border:1px solid var(--strong);background:var(--surface-2);color:var(--text);font-size:.8rem;cursor:pointer;font-weight:600}
.btn:hover{background:#232327}
.btn-sm{padding:6px 11px;font-size:.74rem}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#17130a}
.btn-primary:hover{background:#ecb84e}
.input{width:100%;padding:9px 12px;border:1px solid var(--strong);border-radius:9px;background:var(--surface-2);color:var(--text);font-size:.85rem;font-family:ui-monospace,monospace}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-title{font-weight:650;font-size:1rem}
.card-hint{font-size:.72rem;color:var(--faint);margin-bottom:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.row label{font-size:.76rem;color:var(--muted);display:flex;align-items:center;gap:6px;cursor:pointer}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.62rem;font-family:ui-monospace,monospace;border:1px solid var(--border);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.badge.on{color:var(--ok);border-color:rgba(127,176,105,.4)}
.badge.off{color:var(--faint)}
.note-box{padding:10px 12px;border-radius:9px;font-size:.82rem;margin-bottom:14px;display:none}
.note-box.info{display:block;background:var(--soft);border:1px solid rgba(224,168,60,.4);color:var(--accent)}
.note-box.alert{display:block;background:rgba(212,96,79,.1);border:1px solid rgba(212,96,79,.4);color:var(--danger)}
.loading{padding:60px;text-align:center;color:var(--muted)}
.small{font-size:.72rem;color:var(--faint)}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<script>
const API='https://hiqmvhkwuvvgalqxxtbc.functions.supabase.co/ai-admin';
const app=document.getElementById('app');
const PROVIDERS=[
  {id:'openrouter',label:'OpenRouter',hint:'openrouter.ai — one key, many models. Default model: openrouter/auto',modelPh:'openrouter/auto'},
  {id:'groq',label:'Groq',hint:'console.groq.com — fast, has a free tier. Model is auto-discovered.',modelPh:'(auto-discovered)'},
  {id:'mistral',label:'Mistral',hint:'console.mistral.ai — good fallback. Default: mistral-large-latest',modelPh:'mistral-large-latest'},
];
let configs={};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function extractJwt(v){
  if(!v||typeof v!=='string')return null;
  if(v.startsWith('eyJ')&&v.split('.').length===3)return v;
  if(v.trim().startsWith('{')){try{const o=JSON.parse(v);if(o&&o.access_token)return o.access_token;}catch(e){}}
  return null;
}
function findToken(){
  try{
    const direct=sessionStorage.getItem('weaver_admin_token')||localStorage.getItem('weaver_admin_token');
    if(direct)return direct;
    for(const store of[sessionStorage,localStorage]){
      for(let i=0;i<store.length;i++){
        const jwt=extractJwt(store.getItem(store.key(i)));
        if(jwt)return jwt;
      }
    }
  }catch(e){}
  return '';
}
function toConsole(){window.location.href='index.html';}

async function api(path,opts){
  const res=await fetch(API+path,{
    method:(opts&&opts.method)||'GET',
    headers:{'Authorization':'Bearer '+findToken(),'Content-Type':'application/json'},
    body:opts&&opts.body?JSON.stringify(opts.body):undefined
  });
  const data=await res.json().catch(()=>({}));
  if(res.status===401||res.status===403){toConsole();throw new Error('unauthorized');}
  if(!res.ok)throw new Error(data.error||('HTTP '+res.status));
  return data;
}

function note(text,isErr){
  const n=document.getElementById('note');
  if(!n)return;
  n.className='note-box '+(isErr?'alert':'info');
  n.textContent=text;
  clearTimeout(n._t);
  n._t=setTimeout(()=>{n.className='note-box';n.textContent='';},4000);
}

function render(){
  let html='<div class="topbar">'
    +'<a href="index.html" class="btn btn-sm">← Console</a>'
    +'<h1>AI Provider Keys</h1>'
    +'<span style="flex:1"></span>'
    +'<button id="refresh" class="btn btn-sm">Refresh</button>'
    +'</div>'
    +'<div class="sub">Manage the AI keys Weaver uses for Pro users. Lower priority number = tried first.</div>'
    +'<div class="small" style="margin-bottom:16px">Keys are stored privately and never shown to end users. Changes take effect immediately — no redeploy needed.</div>'
    +'<div id="note" class="note-box"></div>';
  for(const p of PROVIDERS){
    const c=configs[p.id]||{};
    const on=c.enabled!==false&&!!c.api_key;
    html+='<div class="card">'
      +'<div class="card-head">'
      +'<span class="card-title">'+p.label+'</span>'
      +'<span class="badge '+(on?'on':'off')+'">'+(on?'active':'inactive')+'</span>'
      +'</div>'
      +'<div class="card-hint">'+p.hint+'</div>'
      +'<div class="row"><input class="input" type="password" id="key-'+p.id+'" placeholder="Paste '+p.label+' API key…" value="'+esc(c.api_key||'')+'" style="flex:1;min-width:220px"></div>'
      +'<div class="row">'
      +'<label><input type="checkbox" id="en-'+p.id+'" '+(c.enabled!==false?'checked':'')+'> Enabled</label>'
      +'<label>Priority <input class="input" type="number" id="pr-'+p.id+'" value="'+(c.priority??0)+'" style="width:70px"></label>'
      +'<input class="input" type="text" id="mo-'+p.id+'" placeholder="Model override: '+p.modelPh+'" value="'+esc(c.model_override||'')+'" style="flex:1;min-width:180px">'
      +'</div>'
      +'<div class="row"><button class="btn btn-sm btn-primary" data-save="'+p.id+'">Save '+p.label+'</button></div>'
      +'</div>';
  }
  app.innerHTML=html;
  document.getElementById('refresh').onclick=load;
  app.querySelectorAll('[data-save]').forEach(b=>{
    b.onclick=async()=>{
      const id=b.dataset.save;
      b.disabled=true;b.textContent='Saving…';
      try{
        await api('/api/providers',{method:'POST',body:{
          provider:id,
          api_key:document.getElementById('key-'+id).value.trim(),
          enabled:document.getElementById('en-'+id).checked,
          priority:parseInt(document.getElementById('pr-'+id).value,10)||0,
          model_override:document.getElementById('mo-'+id).value.trim()||null,
        }});
        note('Saved '+id+'.');
        load();
      }catch(e){if(e.message!=='unauthorized')note(e.message,true);}
      b.disabled=false;b.textContent='Save '+id;
    };
  });
}

async function load(){
  try{
    const d=await api('/api/providers');
    configs={};
    (d.providers||[]).forEach(p=>{configs[p.provider]=p;});
    render();
  }catch(e){if(e.message!=='unauthorized'){app.innerHTML='<div class="loading">'+esc(e.message)+'</div>';}}
}

if(findToken())load();else toConsole();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weaver</title>
  <link rel="stylesheet" href="css/base.css"/>
  <link rel="stylesheet" href="css/components.css"/>
  <link rel="stylesheet" href="css/layout.css"/>
  <link rel="stylesheet" href="css/views.css"/>
  <!-- v2.0 Stage 1: auth gate styles (dormant until Stage 2) -->
  <link rel="stylesheet" href="css/auth.css"/>
</head>
<body>
  <div class="app-root">
    <!-- v2.0 Stage 1: sign-in gate container.
         Populated by js/auth/auth.js; activated by app.js in Stage 2. -->
    <section id="view-auth" class="view"></section>
    <section id="view-launch" class="view"></section>
    <section id="view-workspace" class="view"></section>
  </div>

  <div class="splash">
    <h1 class="splash-title">Weaver</h1>
    <p class="splash-tag">Structure · Refine · Generate</p>
    <p class="splash-status" id="boot-status">Booting…</p>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weaver</title>
  <meta name="description" content="Weaver — a modular workspace for structuring, refining, and generating long-form creative writing." />
  <link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="%230b0b0c"/><path d="M6 9l5 15 5-10 5 10 5-15" fill="none" stroke="%23e0a83c" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' />
    <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
</head>
<body>
  <div id="app" class="app-root">

    <!-- ============ VIEW: LAUNCH (splash / dashboard) ============ -->
    <section id="view-launch" class="view is-active" aria-label="Launch">
      <div class="splash">
        <svg class="splash-logo" viewBox="0 0 64 64" aria-hidden="true">
          <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="var(--accent)" stroke-width="2.5"/>
          <path d="M14 20l9 26 9-18 9 18 9-26" fill="none" stroke="var(--accent)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h1 class="splash-title">Weaver</h1>
        <p class="splash-tag">Structure &middot; Refine &middot; Generate</p>
        <p class="splash-status" id="boot-status">Booting&hellip;</p>
      </div>
    </section>

    <!-- ============ VIEW: WORKSPACE (three-panel editor) ============ -->
    <section id="view-workspace" class="view" aria-label="Workspace"></section>

  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
